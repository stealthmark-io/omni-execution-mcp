[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-execution-mcp"
version = "1.1.0"
description = "Non-custodial multi-rail DeFi & CeFi execution Model Context Protocol (MCP) server with transparent fee attribution and strict paid-only x402 pre-flight verification on Base USDC"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Omni Money Suite Team"}
]
keywords = [
    "mcp",
    "model-context-protocol",
    "defi",
    "hyperliquid",
    "jupiter",
    "lifi",
    "cow-protocol",
    "polymarket",
    "0x",
    "x402",
    "base-usdc",
    "preflight-guard",
    "non-custodial"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.optional-dependencies]
bot = ["hyperliquid-python-sdk>=0.24,<0.25"]

[project.urls]
Homepage = "https://gateway.stealthmark.io/x402/catalog"
Repository = "https://github.com/stealthmark-io/omni-execution-mcp"

[project.scripts]
omni-execution-mcp = "omni_execution_mcp.server:main"
omni-builder-bot = "omni_execution_mcp.builder_bot.bot:main"

[tool.setuptools.package-data]
"omni_execution_mcp.builder_bot" = ["static/*.html"]
